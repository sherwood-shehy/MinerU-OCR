[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mineru-ocr-skill"
version = "0.4.1"
description = "Faithful Markdown materials with local PDF preflight and MinerU cloud fallback"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "platformdirs>=4.2,<5",
  "pydantic>=2.7,<3",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-httpx>=0.30,<1"]
readable = ["PyMuPDF>=1.24,<2"]
local = ["PyMuPDF==1.28.2", "pymupdf4llm==1.28.2", "pymupdf-layout==1.28.2"]

[project.scripts]
mineru-ocr = "mineru_ocr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mineru_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

